name: Playwright UI Interaction Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: npm ci

    - name: Verify Clean Sync (<project>_sample -> <project>)
      run: |
        npm run sync
        if [ -n "$(git status --porcelain)" ]; then
          echo "Sync mismatch detected! The working tree is not clean after 'npm run sync'."
          git status --short
          exit 1
        fi

    - name: Run Static QA Analysis
      run: npm run qa

    - name: Run Unit Tests
      run: npm run test:league

    - name: Install Playwright Browsers
      # CI実行時間を短縮するため、テストで使用しているChromiumのみインストール
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
